# Configuración del servidor virtual en Nginx para WordPress con PHP-FPM
server {
    # Escucha peticiones HTTP en el puerto 80 interno del contenedor
    listen 80;

    # Responde a cualquier nombre de host solicitado
    server_name _;

    # Raíz del documento web compartida con el volumen wp_data
    root /var/www/html;

    # Archivo predeterminado que se servirá al acceder a un directorio
    index index.php;

    # Límite máximo para el tamaño de subida de archivos (sincronizado con PHP a 64MB)
    client_max_body_size 64M;

    # Oculta el número de versión de Nginx en cabeceras de respuesta y páginas de error
    server_tokens off;

    # Cabeceras de seguridad para protección de clientes
    # Evita que el navegador interprete archivos con tipos MIME diferentes al declarado (MIME sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    # Protege contra ataques de clickjacking impidiendo que la página sea embebida en iframes externos
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Reglas de endurecimiento y denegación de rutas críticas
    # Bloquea el acceso a XML-RPC para prevenir ataques de fuerza bruta y amplificación DDoS
    location = /xmlrpc.php { 
        deny all; 
    }

    # Bloquea el acceso directo al archivo sensible de configuración de WordPress
    location = /wp-config.php { 
        deny all; 
    }

    # Bloquea la ejecución de scripts PHP dentro del directorio de subidas (mitigación RCE)
    location ~* ^/wp-content/uploads/.*\.php$ { 
        deny all; 
    }

    # Procesamiento de peticiones normales y soporte para enlaces permanentes (URLs amigables)
    location / {
        # Intenta servir el archivo exacto ($uri), el directorio ($uri/) y, si no existe, redirige a /index.php con argumentos
        try_files $uri $uri/ /index.php?$args;
    }

    # Delegación de la ejecución de scripts PHP al contenedor wordpress mediante FastCGI
    location ~ \.php$ {
        # Incluye las directivas y parámetros FastCGI estándar de Nginx
        include fastcgi_params;

        # Envía las peticiones PHP al socket de red del contenedor wordpress en el puerto 9000
        fastcgi_pass wordpress:9000;

        # Especifica la ruta absoluta en el sistema de archivos del contenedor PHP para ejecutar el script
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
